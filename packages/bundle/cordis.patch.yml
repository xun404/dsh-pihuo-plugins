# @pihuo/dsh-pihuo — insert over the profile root after dsh-base / dsh-web-app.
# Patch replaces whole config rows; later profile patches must restate keys they change.

- insert:
    - id: pihuo-acp
      name: '@pihuo/dsh-pihuo-acp-worker'
      config:
        providerName: pihuo-acp
        # Override command/args in the profile layer. Empty args refuse start().
        command: node
        args: []

    - id: pihuo-acp-ui
      name: '@pihuo/dsh-pihuo-acp-ui'

    # Copies packaged presets into $DSH_HOME/.agent-presets (see @pihuo/dsh-pihuo-presets).
    - id: pihuo-presets
      name: '@pihuo/dsh-pihuo-presets'
